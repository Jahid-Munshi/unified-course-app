name: "CI Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Prettier Check"
        run: npx prettier --check .

      - name: "Run ESLint"
        run: npm run lint

      - name: "Run TypeScript Strict Typecheck"
        run: npx tsc --noEmit

  test:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Tests with Coverage"
        run: npm test -- --coverage

  build:
    name: "Production Build Check"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Build Next.js Application"
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_db"
          NEXTAUTH_SECRET: "ci-dummy-secret-key-32-chars-long"
          NEXTAUTH_URL: "http://localhost:3000"
